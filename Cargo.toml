[package]
name = "saule-shine"
version = "0.1.0"
edition = "2024"
description = "Shine2D — a Love2D-like 2D game engine for the Saule language, built as a native package."
license = "MIT"
repository = "https://github.com/lauriszz123/saule-shine"
keywords = ["saule", "gamedev", "graphics", "2d"]
categories = ["game-engines", "graphics"]

[lib]
name = "saule_shine"
# `cdylib` produces the `.so` / `.dll` / `.dylib` Saule loads at runtime.
# `rlib` lets this crate's own tests link against it normally.
crate-type = ["cdylib", "rlib"]
path = "src/lib.rs"

# This crate is its own workspace root, so it carries the settings the Saule
# workspace used to provide. Fat LTO and a single codegen unit are worth the
# build time for a renderer whose inner loops cross module boundaries.
[profile.release]
lto = "fat"
codegen-units = 1

[dependencies]
# The SDK does the ABI heavy lifting: `#[saule_export]` generates the C shim,
# infers the Saule signature and compiles it into the library, and
# `saule_package!` declares the package. Authors write only safe Rust.
#
# From git until the SDK is published to crates.io, at which point this becomes
# a plain version requirement. Pin a tag rather than a branch before releasing:
# the native ABI version is checked at load, so the toolchain a package is built
# against is part of what it ships.
saule-sdk = { git = "https://github.com/lauriszz123/saule", branch = "develop" }
# Windows under a Saule display server (`src/protocol.rs`): an app's Shine
# talks to the server's Shine over Saule's own IPC transport — Unix sockets
# or Windows named pipes, with the pixels in shared memory.
saule-ipc = { git = "https://github.com/lauriszz123/saule", branch = "develop" }
# X11-only on Linux: WSLg's Wayland compositor (Weston) lacks server-side
# window decorations, so minifb's Wayland backend fails to map a visible
# window ("Failed to create server-side surface decoration: Missing").
# Unsetting WAYLAND_DISPLAY does NOT help because wayland-client defaults to
# the `wayland-0` socket, so the only reliable fix is to drop the Wayland
# feature at build time and always use XWayland (a working X server).
# Note: minifb's `dlopen` feature implies `wayland-client/dlopen`, so it must
# be omitted too. The `x11` feature uses `x11-dl`, which already loads libX11
# at runtime via dlopen — so no X11 dev headers are needed to build. On
# Windows/macOS these features are inert (Win32/Cocoa is used).
minifb = { version = "0.28", default-features = false, features = ["x11"] }
# TrueType parsing and glyph rasterization for `Graphics.print` / `printf`.
# Pure Rust and `no_std`-friendly, so it adds no system dependencies; the
# engine pairs it with a host-font lookup (see `src/font.rs`) so text works
# without shipping a typeface.
fontdue = "0.9"
# PNG decoding for `Graphics.newImage`. Pure Rust, so image support costs no
# system dependency, matching fontdue's role for text.
png = "0.17"
# System clipboard for `Clipboard.get` / `Clipboard.set`. minifb has no
# clipboard of its own. Default features are off so this stays pure Rust:
# x11rb on Linux and windows-sys here, with no image-data or Wayland backends
# dragging in C libraries.
arboard = { version = "3.6.1", default-features = false }

# Sound for `Audio.*`: device output through cpal (ALSA on Linux, so building
# needs the ALSA development headers), and WAV and Ogg Vorbis decoding in pure
# The GPU (`src/gpu/`): an OpenGL context on the window minifb opened —
# EGL or GLX on X11, WGL on Windows, CGL on macOS — found through the raw
# window handle minifb already exposes, and the GL calls loaded at run time
# through glow. Nothing links against a GL library, so a machine without one
# builds and runs the same, drawing on the CPU.
glutin = { version = "0.32", default-features = false, features = ["egl", "glx", "x11", "wgl"] }
glow = "0.16"
raw-window-handle = "0.6"

# Rust.
rodio = { version = "0.20", default-features = false, features = ["wav", "vorbis"] }

[target.'cfg(target_os = "linux")'.dependencies]
# Presenting through X11 shared memory (`src/state/shm.rs`). Both are already
# in the build through minifb: `x11-dl` loads libX11/libXext at runtime, so no
# X11 headers are needed, and `libc` provides the SysV shared-memory calls.
x11-dl = "2.21"
libc = "0.2"
# The console backend (`src/state/console/`): the screen through DRM/KMS dumb
# buffers when there is no X11 or Wayland session — Saule Linux's bare
# GBM, for drawing on the bare screen through the GPU
# (`src/state/console/gpu.rs`): loaded at run time, like OpenGL, so a
# system without Mesa runs the same, drawing on the CPU.
libloading = "0.8"
# screen. Pure Rust (rustix ioctls), so it needs no libdrm.
drm = "0.14"

[target.'cfg(windows)'.dependencies]
# Per-monitor DPI awareness, and the scale factor for the window. minifb has no
# DPI query of its own, so this asks the OS through the native window handle.
# Windows-only by design: the other platforms report a scale of 1.0 until there
# is an equally honest way to ask them.
windows-sys = { version = "0.61", features = [
    "Win32_UI_HiDpi",
    "Win32_Foundation",
    # Which monitor a new window opens on (`src/state/placement.rs`).
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
] }
